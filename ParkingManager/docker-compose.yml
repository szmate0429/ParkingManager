services:
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: parking_oracle_db
    environment:
      - ORACLE_PASSWORD=ParkingPassword123!
      - APP_USER=parking_user
      - APP_USER_PASSWORD=ParkingPassword123!
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./init-scripts:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15

  parking-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: parking_app
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      - ConnectionStrings__OracleDb=Data Source=oracle-db:1521/FREEPDB1;User Id=parking_user;Password=ParkingPassword123!;
    stdin_open: true 
    tty: true        
volumes:
  oracle_data: